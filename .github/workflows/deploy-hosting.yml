name: Deploy to komissarov.online

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  # Never cancel an in-flight SFTP sync: clear+upload takes ~10–15 min, and a
  # cancelled job leaves the docroot half-empty (REG.RU “сайт размещен некорректно”).
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Paramiko
        run: pip install 'paramiko>=3.4,<4'

      - name: Upload dist over SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_DIR: www/komissarov.online
        run: python scripts/deploy-sftp.py
