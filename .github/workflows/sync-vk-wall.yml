name: Sync VK wall

on:
  schedule:
    - cron: '17 6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: sync-vk-wall
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/sync-vk-wall.mjs
      - run: node scripts/local-assets.mjs
      - name: Commit new posts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/articles public/images/articles src/data/vk-sync.json
          if git diff --cached --quiet; then
            echo 'No new posts'
            exit 0
          fi
          git commit -m "Import new posts from the VK wall"
          git push
